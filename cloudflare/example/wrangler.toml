# the example: `npx wrangler dev` here, after `sbt cloudflareExample`. Every binding works locally but Workers AI and
# Vectorize (remote only): the app does not use them here.
name = "okay-serverless-example"
main = "entry.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GREETING = "hello from vars"

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "KV"
id = "okay-example-kv"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "okay-example"

[[d1_databases]]
binding = "DB"
database_name = "okay-example"
database_id = "00000000-0000-0000-0000-000000000000"

# Postgres through Hyperdrive; locally its connection string from CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_PG
# (e2e.sh starts a Postgres from tools/)
[[hyperdrive]]
binding = "PG"
id = "00000000000000000000000000000000"

[[queues.producers]]
binding = "JOBS"
queue = "okay-jobs"

[[queues.consumers]]
queue = "okay-jobs"
max_batch_timeout = 1

[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 2, period = 60 }

[[analytics_engine_datasets]]
binding = "VIEWS"

[[services]]
binding = "SELF"
service = "okay-serverless-example"

[[send_email]]
name = "MAIL"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Account"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "ORDERS"
class_name = "Order"

[[durable_objects.bindings]]
name = "SHOPS"
class_name = "Shop"

[[durable_objects.bindings]]
name = "REGISTRIES"
class_name = "Registry"

[[durable_objects.bindings]]
name = "TICKERS"
class_name = "Ticker"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Account"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Room", "Order"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Shop"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["Registry"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["Ticker"]
